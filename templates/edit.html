{% extends "base.html" %}

{% block title %}编辑链接 - {{ link.short_code }}{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 20px 0;">
    <div class="glass-card" style="width: 100%; max-width: 580px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.06);">
        <div style="margin-bottom: 30px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); padding-bottom: 20px;">
            <h2 style="font-weight: 600; font-size: 1.4rem; color: var(--text-primary); letter-spacing: -0.5px;">📝 编辑短链接</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 5px;">
                当前短码: <strong style="color: var(--text-primary);">{{ link.short_code }}</strong>
            </p>
            <div style="margin-top: 10px; padding: 12px 16px; background: #f5f5f7; border-radius: 8px; font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between;">
                <span style="color: var(--text-secondary);">短网址链接:</span>
                <a href="{{ public_base_url }}/{{ link.short_code }}" target="_blank" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">
                    {{ public_base_url }}/{{ link.short_code }}
                </a>
            </div>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="short_code" value="{{ link.short_code }}">

            <div class="form-group">
                <label for="original_url">原始长链接 (必填)</label>
                <input type="url" id="original_url" name="original_url" value="{{ link.original_url }}" required>
            </div>
            
            <div class="form-group">
                <label for="note">备注信息 (可选)</label>
                <input type="text" id="note" name="note" value="{{ link.note or '' }}" placeholder="备注说明此链接的用途">
            </div>

            <div class="form-group" style="margin-bottom: 30px;">
                <label for="mode">跳转模式</label>
                <select id="mode" name="mode" required>
                    <option value="redirect" {% if link.mode == 'redirect' %}selected{% endif %}>🦘 跳转模式 (302 Redirect)</option>
                    {% if proxy_enabled %}<option value="proxy" {% if link.mode == 'proxy' %}selected{% endif %}>🐢 代理模式 (Backend Proxy)</option>{% endif %}
                </select>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: center; justify-content: flex-end;">
                <a href="{{ url_for('admin_dashboard') }}" style="color: var(--text-primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 10px 20px; border-radius: 20px; background: #f5f5f7; text-align: center; transition: all 0.2s;" onmouseover="this.style.background='#e8e8ed'" onmouseout="this.style.background='#f5f5f7'">
                    取消
                </a>
                <button type="submit" class="btn-primary" style="padding: 10px 24px; border-radius: 20px;">
                    保存更改
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
