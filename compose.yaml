services:
  shortener:
    build: .
    image: shorten-your-url:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5000}:5000"
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在 .env 中设置强 ADMIN_PASSWORD}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      PROXY_PUBLIC_BASE_URL: "${PROXY_PUBLIC_BASE_URL:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY_COUNT: "${TRUST_PROXY_COUNT:-0}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-}"
      ENABLE_PROXY: "${ENABLE_PROXY:-false}"
      PROXY_ADMIN_ONLY: "${PROXY_ADMIN_ONLY:-true}"
      ENABLE_PROXY_COOKIES: "${ENABLE_PROXY_COOKIES:-true}"
      PROXY_ALLOW_CUSTOM_PORTS: "${PROXY_ALLOW_CUSTOM_PORTS:-false}"
      PROXY_MAX_MB: "${PROXY_MAX_MB:-50}"
      PROXY_MAX_REQUEST_MB: "${PROXY_MAX_REQUEST_MB:-20}"
      PROXY_REWRITE_MAX_MB: "${PROXY_REWRITE_MAX_MB:-25}"
      PROXY_MAX_SSE_STREAMS: "${PROXY_MAX_SSE_STREAMS:-6}"
      WEB_WORKERS: "${WEB_WORKERS:-2}"
      WEB_THREADS: "${WEB_THREADS:-8}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-120}"
    volumes:
      - shortener_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  shortener_data:
